<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solution Display</title>
    <!-- Load KaTeX -->
    <link rel="stylesheet" href="../katex/katex.min.css">
    <script defer src="../katex/katex.min.js"></script>
    <style>
        body {
            background-color: transparent;
            color: #EDEAF5;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 8px 12px;
            margin: 0;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        #solution-content {
            text-align: left;
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #solution-content::-webkit-scrollbar {
            display: none;
        }
        .katex-display {
            text-align: left !important;
            margin: 0.3em 0 !important;
        }
        .katex-display > .katex {
            text-align: left !important;
            white-space: normal;
        }
    </style>
</head>
<body>
    <div id="solution-content"></div>

    <script>
        function updateSolution(latexString) {
            const solutionContent = document.getElementById('solution-content');
            try {
                katex.render(latexString, solutionContent, {
                    throwOnError: false,
                    displayMode: true,
                    strict: false
                });
            } catch (e) {
                solutionContent.innerText = "Error rendering solution";
                console.error(e);
            }
        }
    </script>
</body>
</html>
