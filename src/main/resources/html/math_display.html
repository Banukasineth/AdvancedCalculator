<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Display</title>
    <!-- Load KaTeX -->
    <link rel="stylesheet" href="../katex/katex.min.css">
    <script defer src="../katex/katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            color: #FFFFFF;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: auto;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 4px 6px;
            box-sizing: border-box;
        }
        #math-content {
            text-align: left;
            width: 100%;
            display: block;
        }
        .katex-display {
            text-align: left !important;
            margin: 2px 0 !important;
            padding: 0 !important;
        }
        .katex-display > .katex {
            text-align: left !important;
            white-space: normal;
        }
        .katex-display > .katex > .katex-html {
            text-align: left !important;
        }
        .katex-display > .katex > .katex-html > .tag {
            display: none !important;
        }
        .katex {
            font-size: 2.1em;
            line-height: 1.35;
            text-align: left !important;
            color: #FFFFFF;
        }
        /* Discreet scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="math-content"></div>

    <script>
        function updateMath(latexString) {
            const mathContent = document.getElementById('math-content');
            if (!latexString || latexString.trim() === '') {
                mathContent.innerHTML = '';
                return;
            }
            try {
                katex.render(latexString, mathContent, {
                    throwOnError: false,
                    displayMode: true,
                    strict: false
                });
            } catch (e) {
                mathContent.innerText = "Error rendering math";
                console.error(e);
            }
        }
    </script>
</body>
</html>
